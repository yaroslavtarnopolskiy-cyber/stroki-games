<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" role="img" aria-labelledby="dancer-title dancer-desc" focusable="false">
<title id="dancer-title">Танцовщица — Песни Земли</title>
<desc id="dancer-desc">Танцовщица в народном платье с вышивкой. Одна рука раскрыта в сторону, другая держит красный платок. Расклешённая юбка, руки и платок мягко движутся в танце. Прозрачный фон. Бесшовный цикл четыре секунды. При уменьшении движения в настройках устройства иллюстрация неподвижна.</desc>
<style>
.ink{fill:#272623}.paper{fill:#f5f0ea}.red{fill:#b82719}.line{fill:none;stroke:#272623;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.dance{transform-origin:305px 606px;animation:dance 4s ease-in-out infinite}
.skirt{transform-origin:311px 336px;animation:skirt 4s ease-in-out infinite}
.arm-left{transform-origin:271px 230px;animation:arm-left 4s ease-in-out infinite}
.arm-right{transform-origin:331px 216px;animation:arm-right 4s ease-in-out infinite}
.scarf{transform-origin:433px 137px;animation:scarf 4s ease-in-out infinite}
.foot-left{transform-origin:263px 559px;animation:step 4s ease-in-out infinite}
@keyframes dance{0%,100%{transform:rotate(-1deg) translateY(0)}50%{transform:rotate(1deg) translateY(-3px)}}
@keyframes skirt{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-2deg)}}
@keyframes arm-left{0%,100%{transform:rotate(0deg)}50%{transform:rotate(3deg)}}
@keyframes arm-right{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-2deg)}}
@keyframes scarf{0%,100%{transform:rotate(0deg) skewY(0deg)}50%{transform:rotate(4deg) skewY(-2deg)}}
@keyframes step{0%,100%{transform:rotate(0deg)}50%{transform:rotate(5deg)}}
@media(prefers-reduced-motion:reduce){.dance,.skirt,.arm-left,.arm-right,.scarf,.foot-left{animation:none;transform:none}}
</style>
