<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="gusli-title gusli-desc" focusable="false">
<title id="gusli-title">Гусли — Песни Земли</title>
<desc id="gusli-desc">Крыловидные гусли с веером струн, цветочной резонаторной розеткой и красными лентами. Графитовый контур и светлая дека на прозрачном фоне. Инструмент едва покачивается, ленты мягко колышутся. Бесшовный цикл четыре секунды. При предпочтении уменьшенного движения анимация отключена.</desc>
<style>
.ink{fill:#272623}.paper{fill:#f5f0ea}.red{fill:#b82719}
.instrument{transform-origin:410px 260px;animation:rock 4s ease-in-out infinite}
.ribbons{transform-origin:177px 183px;animation:ribbon 4s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-.5deg) translateY(0)}50%{transform:rotate(.5deg) translateY(-2px)}}
@keyframes ribbon{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1.5deg)}}
@media(prefers-reduced-motion:reduce){.instrument,.ribbons{animation:none;transform:none}}
</style>
